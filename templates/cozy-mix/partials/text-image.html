<section class="story-row container{{image_position_class}}{{image_class}}"><div class="story-copy" style="color:{{text_color}}"><p class="eyebrow">{{subtitle}}</p><h2>{{title}}</h2><p style="color:{{text_color}}">{{body}}</p><div class="feature-list">{{features}}</div></div><div class="story-image"><img src="{{image_url}}" width="1200" height="900" decoding="async" loading="lazy" alt="{{image_alt}}"></div></section>
